name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    name: Deploy to Cloudflare
    # Hosted, which is what the org standard wants for a deploy job anyway:
    # it holds a Cloudflare API token, and those are deliberately kept off the
    # self-hosted fleet. The private predecessor of this repo had to override
    # that exemption because hosted minutes were billing-blocked on private
    # repos; a public repo gets them free, so the override is gone.
    runs-on: ubuntu-latest # allow-bare-runner: holds a Cloudflare API token, which is deliberately kept off the self-hosted fleet
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npx wrangler d1 migrations apply runner-fleet-dashboard --remote
      - run: npx wrangler deploy
