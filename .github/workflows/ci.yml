name: CI

# `strict_required_status_checks_policy` ("require branches to be up to date
# before merging") was turned off org-wide - it forced every open PR to
# update-and-re-run CI after any merge, which is quadratic cost on a 4-6 slot
# self-hosted fleet. The push trigger below is the replacement safety net:
# main is now verified AFTER merge instead of before. This repo is public, so
# the push run lands on ubuntu-latest like the PR run, at no fleet cost.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    timeout-minutes: 10
    name: Type check
    # Hardcoded hosted, not the org's canonical routing expression. This repo is
    # PUBLIC: per Lurking-Walrus/.github-private docs/CI-RUNNER-ROUTING.md a
    # public repo always runs on ubuntu-latest, because a fork PR would
    # otherwise get arbitrary code execution on self-hosted hardware. Public
    # repos also get free hosted minutes, so there is nothing to gain. Do not
    # "restore" the routing expression here — it could only ever evaluate to
    # this same value, while implying the fleet is one config flip away.
    runs-on: ubuntu-latest # allow-bare-runner: public repository: the canonical expression could only ever evaluate to this, and a fork PR must never reach the fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
