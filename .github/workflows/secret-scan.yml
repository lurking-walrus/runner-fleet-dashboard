name: Secret scan

# Gitleaks over the full git history on every PR and push to main. A leaked
# credential stays leaked after the commit that removed it, so the scan walks
# every commit reachable from HEAD rather than just the diff.
#
# INLINE, not the shared caller used by the other 19 adopting repos
# (Lurking-Walrus/.github-private/.github/workflows/secret-scan.yml). Tried
# the shared caller here first and it failed with no jobs dispatched at all
# ("this run likely failed because of a workflow file issue") -- a public
# repository cannot invoke a reusable workflow that lives in a private
# repository, regardless of the .github-private "organization" access-level
# setting, which only covers other repos' visibility, not this direction.
# Changing that setting is an org security-settings change outside the scope
# of this rollout, so this repo carries its own copy of the job body instead.
# Keep it in sync with the shared workflow by hand if that one changes.
#
# Non-required for now: this repo is part of the initial rollout and the
# allowlist backing it has little production evidence yet. Promote
# "secret-scan / Gitleaks (full history)" to a required check once this repo
# has a track record of clean (or correctly allowlisted) runs.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    name: Determine whether checks are required
    runs-on: ubuntu-latest # allow-bare-runner: public repository, excluded from the runner group; hosted minutes are free here
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.dedupe.outputs.run }}
    steps:
      - id: dedupe
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== "push") {
              core.setOutput("run", "true");
              return;
            }

            try {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const targetBranch = context.ref.replace("refs/heads/", "");
              const wasMergedPullRequest = pullRequests.some(
                (pullRequest) => pullRequest.merged_at && pullRequest.base.ref === targetBranch,
              );
              core.setOutput("run", String(!wasMergedPullRequest));
            } catch (error) {
              core.warning(`Could not identify an associated pull request: ${error}`);
              core.setOutput("run", "true");
            }

  # Job id held at "secret-scan" and the inner job name at "Gitleaks (full
  # history)" so the status-check context matches every other adopting repo
  # exactly: "secret-scan / Gitleaks (full history)".
  secret-scan:
    name: Gitleaks (full history)
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest # allow-bare-runner: public repository, excluded from the runner group; hosted minutes are free here
    steps:
      # egress-policy MUST be set explicitly here. harden-runner defaults to
      # `block`, and with no allowed-endpoints that blocks *everything* --
      # actions/checkout then fails with "Failed to connect to github.com
      # port 443". That is exactly what happened on the first run of this
      # workflow (run 33996140372).
      #
      # It was never hit anywhere else in the org because harden-runner's
      # eBPF egress enforcement only works on GITHUB-HOSTED runners; on the
      # self-hosted fleet it silently no-ops. Every private repo routes to
      # the fleet, so this repo -- the only public one, and therefore the
      # only one on hosted runners -- is the first place the default bit.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              gitleaks_arch="x64"
              expected_sha256="${GITLEAKS_SHA256_X64}"
              ;;
            aarch64|arm64)
              gitleaks_arch="arm64"
              expected_sha256="${GITLEAKS_SHA256_ARM64}"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="gitleaks_${GITLEAKS_VERSION}_linux_${gitleaks_arch}.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${expected_sha256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 gitleaks "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          rm -f "$archive" gitleaks
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks git --no-banner --redact --exit-code 1 \
            --report-format json --report-path gitleaks-report.json .

      - name: Upload redacted findings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
